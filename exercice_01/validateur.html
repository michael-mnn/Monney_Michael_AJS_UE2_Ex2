<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valideut de mot de passe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <main>

        <div class="container">
            <form>
                <fieldset>
                    <legend>Verificateur de mot de passe</legend>

                    <div class="mb-3">
                        <label for="motDePasse" class="form-label">Password</label>
                        <input type="password" class="form-control" id="motDePasse">
                    </div>

                    <div class="has-error" id="error"></div>
                    <br>
                    <button class="btn btn-primary" type="submit" id="button">Envoyer</button>
                </fieldset>

            </form>
        </div>


        <script src="./validateur.js"></script>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>


</html>
